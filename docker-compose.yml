services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tsin
      POSTGRES_PASSWORD: tsin_demo
      POSTGRES_DB: tsin_hr
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tsin_pg_data:/var/lib/postgresql/data

volumes:
  tsin_pg_data:
